name: Zyberlane XR checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check presentation JavaScript syntax
        run: node --check design.js
      - name: Check player-first UI controller syntax
        run: node --check ui.js
      - name: Test tracking and frontend contracts
        run: node --test tests/*.test.cjs

  browser:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save --no-fund --no-audit playwright@1.55.0
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate local browser-supported video fixture
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=gray:s=160x90:r=12 -t 3 -c:v libvpx -b:v 140k /tmp/zyberlane-xr-test.webm
      - name: Start isolated localhost static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zyberlane-xr-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then exit 0; fi
            sleep 1
          done
          cat /tmp/zyberlane-xr-http.log
          exit 1
      - name: Chromium player-first behavior and screenshots
        run: node tests/browser-smoke.cjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyberlane-xr-player-first-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: warn
          retention-days: 14
